<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/timing.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #cfe8ff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #world {
        position: absolute;
        inset: 0;
        background: #cfe8ff;
      }
      #world-canvas {
        display: block;
        width: 1080px;
        height: 1920px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25.5"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="world"
        class="clip"
        data-start="0"
        data-duration="25.5"
        data-track-index="0"
        style="z-index: 1"
      >
        <canvas id="world-canvas" width="1080" height="1920"></canvas>
      </div>
      <div
        id="overlay"
        data-composition-id="overlay"
        data-composition-src="compositions/overlay.html"
        data-start="0"
        data-duration="25.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 10"
      ></div>
      <audio
        id="sfx-sneak"
        class="clip"
        src="assets/pop.mp3"
        data-start="1.80"
        data-track-index="4"
        data-volume="0.35"
      ></audio>
      <audio
        id="sfx-splash1"
        class="clip"
        src="assets/impact-bass-1.mp3"
        data-start="4.50"
        data-track-index="5"
        data-volume="0.6"
      ></audio>
      <audio
        id="sfx-splash1b"
        class="clip"
        src="assets/pop.mp3"
        data-start="4.55"
        data-track-index="6"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-laugh1"
        class="clip"
        src="assets/applause.wav"
        data-start="6.40"
        data-track-index="7"
        data-volume="0.35"
      ></audio>
      <audio
        id="sfx-ring1"
        class="clip"
        src="assets/ping.mp3"
        data-start="7.70"
        data-track-index="8"
        data-volume="0.45"
      ></audio>
      <audio
        id="sfx-ring2"
        class="clip"
        src="assets/ping.mp3"
        data-start="8.50"
        data-track-index="9"
        data-volume="0.45"
      ></audio>
      <audio
        id="sfx-cut"
        class="clip"
        src="assets/whoosh.mp3"
        data-start="11.55"
        data-track-index="10"
        data-volume="0.4"
      ></audio>
      <audio
        id="sfx-drama"
        class="clip"
        src="assets/drama.wav"
        data-start="11.80"
        data-track-index="11"
        data-volume="0.45"
      ></audio>
      <audio
        id="sfx-gavel1"
        class="clip"
        src="assets/gong.wav"
        data-start="13.60"
        data-track-index="12"
        data-volume="0.45"
      ></audio>
      <audio
        id="sfx-gavel2"
        class="clip"
        src="assets/impact-bass-2.mp3"
        data-start="18.55"
        data-track-index="13"
        data-volume="0.45"
      ></audio>
      <audio
        id="sfx-splash2"
        class="clip"
        src="assets/impact-bass-1.mp3"
        data-start="18.70"
        data-track-index="14"
        data-volume="0.6"
      ></audio>
      <audio
        id="sfx-cheer"
        class="clip"
        src="assets/applause.wav"
        data-start="18.90"
        data-track-index="15"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-end"
        class="clip"
        src="assets/whoosh-short.mp3"
        data-start="22.55"
        data-track-index="16"
        data-volume="0.4"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
    <script type="module" src="assets/world.js"></script>
  </body>
</html>
