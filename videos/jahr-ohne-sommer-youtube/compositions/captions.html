  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div id="cap-0" class="capg"><span>Stell dir vor,</span></div>
    <div id="cap-1" class="capg"><span>es ist Juni.</span></div>
    <div id="cap-2" class="capg"><span>Du willst ins Freibad.</span></div>
    <div id="cap-3" class="capg"><span>Und draußen</span></div>
    <div id="cap-4" class="capg"><span>schneit es.</span></div>
    <div id="cap-5" class="capg"><span>Genau das ist passiert.</span></div>
    <div id="cap-6" class="capg"><span>Im Jahr 1816.</span></div>
    <div id="cap-7" class="capg"><span>Man nennt es:</span></div>
    <div id="cap-8" class="capg"><span>das Jahr ohne Sommer.</span></div>
    <div id="cap-9" class="capg"><span>Ernten verfaulten, Brot wurde unbezahlbar,</span></div>
    <div id="cap-10" class="capg"><span>Menschen wanderten aus.</span></div>
    <div id="cap-11" class="capg"><span>Und am Ende entstand sogar ein</span></div>
    <div id="cap-12" class="capg"><span>Monster.</span></div>
    <div id="cap-13" class="capg"><span>Und alles begann mit einem einzigen</span></div>
    <div id="cap-14" class="capg"><span>Berg.</span></div>
    <div id="cap-15" class="capg"><span>Über 11.000 Kilometer entfernt.</span></div>
    <div id="cap-16" class="capg"><span>Indonesien, die Insel Sumbawa.</span></div>
    <div id="cap-17" class="capg"><span>Hier steht der Tambora,</span></div>
    <div id="cap-18" class="capg"><span>ein Vulkan, über 4.000 Meter hoch.</span></div>
    <div id="cap-19" class="capg"><span>Am 5. April 1815 grollt er</span></div>
    <div id="cap-20" class="capg"><span>zum ersten Mal.</span></div>
    <div id="cap-21" class="capg"><span>Am Abend des 10. April explodiert</span></div>
    <div id="cap-22" class="capg"><span>er.</span></div>
    <div id="cap-23" class="capg"><span>Feuersäulen schießen in den Himmel.</span></div>
    <div id="cap-24" class="capg"><span>Glühende Lawinen aus Asche und Gas</span></div>
    <div id="cap-25" class="capg"><span>rasen die Hänge hinunter,</span></div>
    <div id="cap-26" class="capg"><span>bis ins Meer.</span></div>
    <div id="cap-27" class="capg"><span>Den Knall hört man über 1.000</span></div>
    <div id="cap-28" class="capg"><span>Kilometer weit.</span></div>
    <div id="cap-29" class="capg"><span>Auf Java hält man ihn für</span></div>
    <div id="cap-30" class="capg"><span>Kanonendonner und schickt Soldaten los.</span></div>
    <div id="cap-31" class="capg"><span>Rund um den Berg wird es</span></div>
    <div id="cap-32" class="capg"><span>tagelang stockdunkel.</span></div>
    <div id="cap-33" class="capg"><span>Tag und Nacht sind nicht mehr</span></div>
    <div id="cap-34" class="capg"><span>zu unterscheiden.</span></div>
    <div id="cap-35" class="capg"><span>Danach ist der Tambora fast eineinhalb</span></div>
    <div id="cap-36" class="capg"><span>Kilometer niedriger.</span></div>
    <div id="cap-37" class="capg"><span>Wo der Gipfel war,</span></div>
    <div id="cap-38" class="capg"><span>klafft ein riesiger Krater.</span></div>
    <div id="cap-39" class="capg"><span>Es ist der stärkste Vulkanausbruch der</span></div>
    <div id="cap-40" class="capg"><span>überlieferten Geschichte.</span></div>
    <div id="cap-41" class="capg"><span>Viel stärker als der berühmte Krakatau.</span></div>
    <div id="cap-42" class="capg"><span>Mehr als 10.000 Menschen sterben sofort.</span></div>
    <div id="cap-43" class="capg"><span>Ganze Dörfer, sogar ein kleines Königreich,</span></div>
    <div id="cap-44" class="capg"><span>verschwinden unter der Asche.</span></div>
    <div id="cap-45" class="capg"><span>Und dann kommt der Hunger.</span></div>
    <div id="cap-46" class="capg"><span>Die Asche hat Felder und Brunnen</span></div>
    <div id="cap-47" class="capg"><span>begraben.</span></div>
    <div id="cap-48" class="capg"><span>Zehntausende weitere sterben.</span></div>
    <div id="cap-49" class="capg"><span>Aber der Tambora schleudert nicht nur</span></div>
    <div id="cap-50" class="capg"><span>Asche</span></div>
    <div id="cap-51" class="capg"><span>hoch.</span></div>
    <div id="cap-52" class="capg"><span>Sondern vor allem etwas Unsichtbares:</span></div>
    <div id="cap-53" class="capg"><span>Schwefel.</span></div>
    <div id="cap-54" class="capg"><span>Rund 60 Millionen Tonnen Schwefeldioxid</span></div>
    <div id="cap-55" class="capg"><span>steigen auf.</span></div>
    <div id="cap-56" class="capg"><span>Bis in die Stratosphäre,</span></div>
    <div id="cap-57" class="capg"><span>über 40 Kilometer hoch.</span></div>
    <div id="cap-58" class="capg"><span>Dort oben gibt es keinen Regen,</span></div>
    <div id="cap-59" class="capg"><span>der das Gas auswäscht.</span></div>
    <div id="cap-60" class="capg"><span>Es wird zu winzigen Tröpfchen.</span></div>
    <div id="cap-61" class="capg"><span>Die Winde tragen sie einmal um</span></div>
    <div id="cap-62" class="capg"><span>die ganze Erde.</span></div>
    <div id="cap-63" class="capg"><span>Wie ein dünner Schleier legen sie</span></div>
    <div id="cap-64" class="capg"><span>sich um den Planeten.</span></div>
    <div id="cap-65" class="capg"><span>Und dieser Schleier wirft einen Teil</span></div>
    <div id="cap-66" class="capg"><span>des Sonnenlichts zurück ins All,</span></div>
    <div id="cap-67" class="capg"><span>bevor es unten ankommt.</span></div>
    <div id="cap-68" class="capg"><span>Im Durchschnitt wird es auf der</span></div>
    <div id="cap-69" class="capg"><span>Erde etwa ein halbes bis ein</span></div>
    <div id="cap-70" class="capg"><span>Grad kälter.</span></div>
    <div id="cap-71" class="capg"><span>Klingt wenig.</span></div>
    <div id="cap-72" class="capg"><span>Ist es aber nicht.</span></div>
    <div id="cap-73" class="capg"><span>Denn ein Grad weniger im Durchschnitt</span></div>
    <div id="cap-74" class="capg"><span>heißt:</span></div>
    <div id="cap-75" class="capg"><span>kalte Tage, späte Fröste.</span></div>
    <div id="cap-76" class="capg"><span>Und Regen, Regen,</span></div>
    <div id="cap-77" class="capg"><span>Regen.</span></div>
    <div id="cap-78" class="capg"><span>Das Erstaunliche:</span></div>
    <div id="cap-79" class="capg"><span>Damals wusste niemand,</span></div>
    <div id="cap-80" class="capg"><span>woher die Kälte kam.</span></div>
    <div id="cap-81" class="capg"><span>Den</span></div>
    <div id="cap-82" class="capg"><span>Zusammenhang erkannte man erst rund</span></div>
    <div id="cap-83" class="capg"><span>100 Jahre später.</span></div>
    <div id="cap-84" class="capg"><span>Europa, Frühjahr 1816.</span></div>
    <div id="cap-85" class="capg"><span>Der Schnee will einfach nicht schmelzen.</span></div>
    <div id="cap-86" class="capg"><span>Im Mai:</span></div>
    <div id="cap-87" class="capg"><span>Frost.</span></div>
    <div id="cap-88" class="capg"><span>Und in der Schweiz schneit es</span></div>
    <div id="cap-89" class="capg"><span>in diesem Jahr in jedem einzelnen</span></div>
    <div id="cap-90" class="capg"><span>Monat.</span></div>
    <div id="cap-91" class="capg"><span>Dazu regnet es.</span></div>
    <div id="cap-92" class="capg"><span>Wochenlang.</span></div>
    <div id="cap-93" class="capg"><span>Flüsse und Seen treten über die</span></div>
    <div id="cap-94" class="capg"><span>Ufer.</span></div>
    <div id="cap-95" class="capg"><span>In Süddeutschland ist es mitten im</span></div>
    <div id="cap-96" class="capg"><span>Sommer zwei bis drei Grad kälter</span></div>
    <div id="cap-97" class="capg"><span>als normal.</span></div>
    <div id="cap-98" class="capg"><span>Auch in Nordamerika.</span></div>
    <div id="cap-99" class="capg"><span>In Neuengland schneit es im Juni,</span></div>
    <div id="cap-100" class="capg"><span>und im Juli und August gibt</span></div>
    <div id="cap-101" class="capg"><span>es Nachtfrost.</span></div>
    <div id="cap-102" class="capg"><span>Die Amerikaner nennen das Jahr später:</span></div>
    <div id="cap-103" class="capg"><span>Eighteen hundred and froze to death.</span></div>
    <div id="cap-104" class="capg"><span>Achtzehnhundert und erfroren.</span></div>
    <div id="cap-105" class="capg"><span>Und in Asien?</span></div>
    <div id="cap-106" class="capg"><span>In China fallen Ernten aus.</span></div>
    <div id="cap-107" class="capg"><span>In Indien gerät der Monsun durcheinander.</span></div>
    <div id="cap-108" class="capg"><span>Für die Bauern ist es eine</span></div>
    <div id="cap-109" class="capg"><span>Katastrophe.</span></div>
    <div id="cap-110" class="capg"><span>Das Getreide wird nicht reif.</span></div>
    <div id="cap-111" class="capg"><span>Es verfault auf den nassen Feldern.</span></div>
    <div id="cap-112" class="capg"><span>Kartoffeln faulen in der</span></div>
    <div id="cap-113" class="capg"><span>Erde.</span></div>
    <div id="cap-114" class="capg"><span>Und der Wein wird so sauer,</span></div>
    <div id="cap-115" class="capg"><span>dass man ihn kaum trinken kann.</span></div>
    <div id="cap-116" class="capg"><span>Die Folge:</span></div>
    <div id="cap-117" class="capg"><span>Die Preise explodieren.</span></div>
    <div id="cap-118" class="capg"><span>Getreide kostet bald zwei-,</span></div>
    <div id="cap-119" class="capg"><span>dreimal so viel wie vorher.</span></div>
    <div id="cap-120" class="capg"><span>Im Winter und im Frühjahr 1817</span></div>
    <div id="cap-121" class="capg"><span>wird der Hunger richtig schlimm.</span></div>
    <div id="cap-122" class="capg"><span>Menschen strecken ihr Brot mit Sägemehl</span></div>
    <div id="cap-123" class="capg"><span>und Baumrinde.</span></div>
    <div id="cap-124" class="capg"><span>Sie essen Gras,</span></div>
    <div id="cap-125" class="capg"><span>Moos und Brennnesseln.</span></div>
    <div id="cap-126" class="capg"><span>Bettler ziehen von Dorf zu Dorf.</span></div>
    <div id="cap-127" class="capg"><span>In der Schweiz und in Süddeutschland</span></div>
    <div id="cap-128" class="capg"><span>sterben Tausende.</span></div>
    <div id="cap-129" class="capg"><span>Wer kann, packt seine Sachen.</span></div>
    <div id="cap-130" class="capg"><span>Aus Baden und Württemberg wandern Zehntausende</span></div>
    <div id="cap-131" class="capg"><span>aus.</span></div>
    <div id="cap-132" class="capg"><span>Die einen ziehen die Donau hinunter</span></div>
    <div id="cap-133" class="capg"><span>nach Russland, bis in den Kaukasus.</span></div>
    <div id="cap-134" class="capg"><span>Die anderen über Holland nach Amerika.</span></div>
    <div id="cap-135" class="capg"><span>Viele erreichen ihr Ziel</span></div>
    <div id="cap-136" class="capg"><span>nie.</span></div>
    <div id="cap-137" class="capg"><span>Auf den überfüllten Schiffen sterben</span></div>
    <div id="cap-138" class="capg"><span>unzählige an Krankheiten.</span></div>
    <div id="cap-139" class="capg"><span>Doch das Jahr ohne Sommer hat</span></div>
    <div id="cap-140" class="capg"><span>nicht nur Leid hinterlassen.</span></div>
    <div id="cap-141" class="capg"><span>Sondern auch ein paar überraschende</span></div>
    <div id="cap-142" class="capg"><span>Spuren.</span></div>
    <div id="cap-143" class="capg"><span>Juni 1816, eine Villa am Genfer</span></div>
    <div id="cap-144" class="capg"><span>See.</span></div>
    <div id="cap-145" class="capg"><span>Wegen des Dauerregens sitzen ein paar</span></div>
    <div id="cap-146" class="capg"><span>junge Engländer drinnen fest.</span></div>
    <div id="cap-147" class="capg"><span>Lord Byron schlägt einen Wettbewerb</span></div>
    <div id="cap-148" class="capg"><span>vor:</span></div>
    <div id="cap-149" class="capg"><span>Jeder soll eine Gruselgeschichte schreiben.</span></div>
    <div id="cap-150" class="capg"><span>Die achtzehnjährige Mary Shelley erfindet</span></div>
    <div id="cap-151" class="capg"><span>dabei eine Figur,</span></div>
    <div id="cap-152" class="capg"><span>die bis heute weltberühmt ist:</span></div>
    <div id="cap-153" class="capg"><span>Frankenstein.</span></div>
    <div id="cap-154" class="capg"><span>Zweite Spur:</span></div>
    <div id="cap-155" class="capg"><span>Mannheim.</span></div>
    <div id="cap-156" class="capg"><span>Hafer ist so teuer,</span></div>
    <div id="cap-157" class="capg"><span>dass viele Pferde nicht mehr gefüttert</span></div>
    <div id="cap-158" class="capg"><span>werden können.</span></div>
    <div id="cap-159" class="capg"><span>1817 baut Karl Drais eine Laufmaschine.</span></div>
    <div id="cap-160" class="capg"><span>Zwei Räder, ein Lenker,</span></div>
    <div id="cap-161" class="capg"><span>kein Pferd.</span></div>
    <div id="cap-162" class="capg"><span>Der Urahn des Fahrrads.</span></div>
    <div id="cap-163" class="capg"><span>Ob der Hafermangel ihn wirklich darauf</span></div>
    <div id="cap-164" class="capg"><span>brachte, ist nicht sicher.</span></div>
    <div id="cap-165" class="capg"><span>Aber manche Forscher vermuten es.</span></div>
    <div id="cap-166" class="capg"><span>Und in Württemberg gründet König Wilhelm</span></div>
    <div id="cap-167" class="capg"><span>der Erste eine Landwirtschaftsschule.</span></div>
    <div id="cap-168" class="capg"><span>Damit so ein Hunger nie wieder</span></div>
    <div id="cap-169" class="capg"><span>passiert.</span></div>
    <div id="cap-170" class="capg"><span>Dazu ein großes Landwirtschaftsfest</span></div>
    <div id="cap-171" class="capg"><span>in Cannstatt.</span></div>
    <div id="cap-172" class="capg"><span>Daraus wird später:</span></div>
    <div id="cap-173" class="capg"><span>der Cannstatter Wasen.</span></div>
    <div id="cap-174" class="capg"><span>1817 wird das Wetter endlich besser.</span></div>
    <div id="cap-175" class="capg"><span>Als die ersten vollen Erntewagen in</span></div>
    <div id="cap-176" class="capg"><span>die Dörfer rollen,</span></div>
    <div id="cap-177" class="capg"><span>feiern die Menschen.</span></div>
    <div id="cap-178" class="capg"><span>Heute wissen wir:</span></div>
    <div id="cap-179" class="capg"><span>Ein einziger großer Ausbruch kann das</span></div>
    <div id="cap-180" class="capg"><span>Klima der ganzen Welt für Jahre</span></div>
    <div id="cap-181" class="capg"><span>verändern.</span></div>
    <div id="cap-182" class="capg"><span>1991 zum Beispiel:</span></div>
    <div id="cap-183" class="capg"><span>Der Pinatubo auf den Philippinen.</span></div>
    <div id="cap-184" class="capg"><span>Danach war es weltweit messbar kühler.</span></div>
    <div id="cap-185" class="capg"><span>Und der Tambora hat etwa dreimal</span></div>
    <div id="cap-186" class="capg"><span>so viel Schwefel ausgestoßen.</span></div>
    <div id="cap-187" class="capg"><span>Deshalb beobachten Forscher heute Vulkane</span></div>
    <div id="cap-188" class="capg"><span>auf der ganzen Welt.</span></div>
    <div id="cap-189" class="capg"><span>Ein einziger Vulkan.</span></div>
    <div id="cap-190" class="capg"><span>Und die halbe Welt hatte keinen</span></div>
    <div id="cap-191" class="capg"><span>Sommer.</span></div>
  </div>
