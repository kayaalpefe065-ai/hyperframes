  <div id="root" data-composition-id="s31" data-width="1920" data-height="1080">
    <div id="s31-cam">
      <svg id="s31-art" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="s31-boil" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence id="s31-turb" type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="1" />

        </defs>
        <g filter="url(#s31-boil)">
<g id="s31-sk" transform="translate(400,860) scale(1.3)" ><g id="s31-sk-in"><path d="M-110,0 Q-140,-160 -70,-230 L-90,-270 L90,-270 L70,-230 Q140,-160 110,0 Z" fill="#d9c08a"/><path d="M-80,-250 L80,-250" fill="none"/></g></g>

<div id="s31-x2" class="label " style="left:1360px;top:470px;font-size:96px;color:#e8483b;text-align:center;" data-rot="0"><span class="wd">×2</span></div>
<div id="s31-x3" class="label " style="left:1600px;top:120px;font-size:110px;color:#e8483b;text-align:center;" data-rot="0"><span class="wd">×3</span></div>
<div id="s31-ly" class="label " style="left:760px;top:880px;font-size:40px;color:#1f1d1a;text-align:center;" data-rot="0"><span class="wd">1815</span></div>
<div id="s31-ly2" class="label " style="left:1600px;top:880px;font-size:40px;color:#1f1d1a;text-align:center;" data-rot="0"><span class="wd">1817</span></div>
    </div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const SHAPES = "path, line, circle, rect, ellipse, polygon, polyline";
      // Draw ink on: every stroke of the selection is drawn from its start, then its fill washes in.
      const D = (sel, at, dur) => {
        const els = [];
        document.querySelectorAll(sel).forEach((n) => (n.matches(SHAPES) ? els.push(n) : els.push(...n.querySelectorAll(SHAPES))));
        const shapes = els.filter((e) => !e.closest("marker, clipPath"));
        shapes.forEach((e) => e.setAttribute("pathLength", "1"));
        tl.fromTo(shapes, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at);
        tl.fromTo(shapes, { strokeDasharray: "1 1", strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power1.inOut", stagger: Math.min(0.05, (dur * 0.5) / shapes.length) }, at);
        tl.fromTo(shapes, { fillOpacity: 0 }, { fillOpacity: 1, duration: dur * 0.6, ease: "none" }, at + dur * 0.45);
      };
      // Write a hand-lettered label: its words appear one after another out of a slight blur.
      const W = (sel, at, gap) => {
        const el = document.querySelector(sel);
        const rot = Number(el.dataset.rot || 0);
        if (rot) tl.set(el, { rotation: rot }, 0);
        if (el.classList.contains("box")) tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, at);
        tl.fromTo(el.querySelectorAll(".wd"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: gap, ease: "none" }, at);
      };
      // Slap a photo onto the paper: it drops in slightly large and turned, lands, then drifts in close.
      const P = (sel, at, rot) => {
        tl.fromTo(sel, { opacity: 0, scale: 1.18, rotation: rot + 7 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.45, ease: "expo.out" }, at);
        tl.fromTo(sel + "-img", { scale: 1 }, { scale: 1.08, duration: 6, ease: "none" }, at);
      };
      const turb = document.querySelector("#s31-turb");
      const clock = { t: 0 };
      tl.to(clock, { t: 7.13, duration: 7.13, ease: "none", onUpdate: () => turb.setAttribute("seed", String(1 + (Math.floor(clock.t * 12) % 6))) }, 0);
      tl.fromTo("#s31-cam", { scale: 1.0 }, { scale: 1.03, duration: 7.13, ease: "sine.inOut" }, 0);
      D("#s31-sk", 0.1, 0.5);
      W("#s31-lg", 0.3, 0.08);
      D("#s31-axes", 0.4, 0.4);
      W("#s31-ly", 0.6, 0.08);
      W("#s31-ly2", 0.7, 0.08);
      D("#s31-line", 1.42, 1.3);
      W("#s31-x2", 4.15, 0.08);
      W("#s31-x3", 4.54, 0.08);
      window.__timelines["s31"] = tl;
    })();
  </script>
