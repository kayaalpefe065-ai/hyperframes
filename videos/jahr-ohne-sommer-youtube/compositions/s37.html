    (() => {
      const tl = gsap.timeline({ paused: true });
      const SHAPES = "path, line, circle, rect, ellipse, polygon, polyline";

      const D = (sel, at, dur) => {
        const els = [];

      const W = (sel, at, gap) => {

        const rot = Number(el.dataset.rot || 0);
        if (rot) tl.set(el, { rotation: rot }, 0);
