<template>
  <style>
    @font-face { font-family: "Patrick Hand"; src: url("assets/fonts/patrick-hand.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Patrick Hand", sans-serif; color: #1f1d1a; }
    #c4-cam { position: absolute; inset: 0; }
    #c4-art { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
    #c4-art :is(line, path, circle, rect, ellipse, polygon, polyline) { stroke: #1f1d1a; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    #c4-cam .label { position: absolute; line-height: 1.05; white-space: nowrap; }
    #c4-cam .label.box { background: #fffcf5; border: 6px solid #1f1d1a; border-radius: 18px; padding: 6px 22px; }
    #c4-cam .wd { display: inline-block; }
    #c4-cam .photo { position: absolute; background: #fffdf8; padding: 16px 16px 52px; box-shadow: 0 10px 22px rgba(40, 30, 20, 0.28); }
    #c4-cam .ph-clip { width: 100%; height: 100%; overflow: hidden; background: #ddd; }
    #c4-cam .ph-clip img { width: 100%; height: 100%; display: block; }
    #c4-cam .tape { position: absolute; width: 120px; height: 40px; background: rgba(236, 222, 170, 0.82); }
    #c4-cam .tape:first-of-type { transform: rotate(-24deg); }
    #c4-cam .tape:last-of-type { transform: rotate(24deg); }
    #c4-cam .credit { position: absolute; left: 16px; right: 16px; bottom: 8px; font-size: 28px; color: #4a453e; white-space: nowrap; overflow: hidden; }
    #c4-cam .cal { position: absolute; background: #fff; border: 7px solid #1f1d1a; border-radius: 22px; text-align: center; overflow: hidden; }
    #c4-cam .cal-top { color: #fff; font-size: 44px; padding: 8px 0; border-bottom: 7px solid #1f1d1a; }
    #c4-cam .cal-big { font-size: 80px; padding: 10px 0 14px; }

    #root { background: #f4efe4; }
  </style>
  <div id="root" data-composition-id="c4" data-width="1920" data-height="1080">
    <div id="c4-cam">
      <svg id="c4-art" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="c4-boil" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence id="c4-turb" type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="1" />
            <feDisplacementMap in="SourceGraphic" scale="4" />
          </filter>
        </defs>
        <g filter="url(#c4-boil)">
<g id="c4-icon"><ellipse cx="960" cy="830" rx="150" ry="44" fill="#fff"/><ellipse cx="960" cy="822" rx="96" ry="22" fill="#efe3cf" style="stroke-width:5"/></g>
<g id="c4-ul"><path d="M560,640 Q960,610 1360,640" fill="none" style="stroke:#e8483b;stroke-width:12"/></g>
        </g>

      </svg>
<div id="c4-part" class="label " style="left:0px;top:300px;font-size:64px;color:#6b645a;text-align:center;width:1920px;" data-rot="0"><span class="wd">Teil</span> <span class="wd">4</span></div>
<div id="c4-title" class="label " style="left:0px;top:400px;font-size:150px;color:#1f1d1a;text-align:center;width:1920px;" data-rot="0"><span class="wd">Hunger</span></div>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const SHAPES = "path, line, circle, rect, ellipse, polygon, polyline";
      // Draw ink on: every stroke of the selection is drawn from its start, then its fill washes in.
      const D = (sel, at, dur) => {
        const els = [];
        document.querySelectorAll(sel).forEach((n) => (n.matches(SHAPES) ? els.push(n) : els.push(...n.querySelectorAll(SHAPES))));
        const shapes = els.filter((e) => !e.closest("marker, clipPath"));
        shapes.forEach((e) => e.setAttribute("pathLength", "1"));
        tl.fromTo(shapes, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, at);
        tl.fromTo(shapes, { strokeDasharray: "1 1", strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power1.inOut", stagger: Math.min(0.05, (dur * 0.5) / shapes.length) }, at);
        tl.fromTo(shapes, { fillOpacity: 0 }, { fillOpacity: 1, duration: dur * 0.6, ease: "none" }, at + dur * 0.45);
      };
      // Write a hand-lettered label: its words appear one after another out of a slight blur.
      const W = (sel, at, gap) => {
        const el = document.querySelector(sel);
        const rot = Number(el.dataset.rot || 0);
        if (rot) tl.set(el, { rotation: rot }, 0);
        if (el.classList.contains("box")) tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, at);
        tl.fromTo(el.querySelectorAll(".wd"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, stagger: gap, ease: "none" }, at);
      };
      // Slap a photo onto the paper: it drops in slightly large and turned, lands, then drifts in close.
      const P = (sel, at, rot) => {
        tl.fromTo(sel, { opacity: 0, scale: 1.18, rotation: rot + 7 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.45, ease: "expo.out" }, at);
        tl.fromTo(sel + "-img", { scale: 1 }, { scale: 1.08, duration: 6, ease: "none" }, at);
      };
      const turb = document.querySelector("#c4-turb");
      const clock = { t: 0 };
      tl.to(clock, { t: 3.0, duration: 3.0, ease: "none", onUpdate: () => turb.setAttribute("seed", String(1 + (Math.floor(clock.t * 12) % 6))) }, 0);
      tl.fromTo("#c4-cam", { scale: 1.06 }, { scale: 1.0, duration: 3.0, ease: "sine.inOut" }, 0);
      W("#c4-part", 0.15, 0.08);
      W("#c4-title", 0.35, 0.12);
      D("#c4-ul", 0.8, 0.5);
      D("#c4-icon", 0.5, 0.8);
      window.__timelines["c4"] = tl;
    })();
  </script>
</template>
